[package]
name = "tauri-image-converter"
version = "1.0.0"
description = "A fast, lightweight desktop image converter for Windows with both GUI and CLI support. Built with Tauri 2, Rust, and Preact for optimal performance and minimal resource usage"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/constDEFE/tauri-image-converter"
homepage = "https://github.com/constDEFE/tauri-image-converter"
keywords = ["image", "converter", "tauri", "windows", "gui"]
categories = ["multimedia::images", "gui"]
rust-version = "1.85"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "avif", "avif-native", "ico"] }
fast_image_resize = "6.0"
webp = "0.3.1"
ravif = { version = "0.12", default-features = false, features = ["threading"] }
rgb = "0.8"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
once_cell = "1.21"
rayon = "1.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
